[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subjective_devagents_fastapi"
version = "0.1.0"
description = "FastAPI backend for Subjective DevAgents (web-only client). Python port of the Node ChatCore/LlmService/SuSessionManager backend."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
