[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subjective_devagents_fastapi"
version = "0.1.0"
description = "FastAPI backend for Subjective DevAgents (web-only client). Python port of the Node ChatCore/LlmService/SuSessionManager backend."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # firebase_auth.py imports jwt/PyJWKClient at module scope; without this the
    # app fails to import rather than degrading to unauthenticated.
    "pyjwt[crypto]>=2.8",
    "websockets>=12",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "selenium>=4.20",
    "requests>=2.25.1",
]

[tool.setuptools.packages.find]
where = ["src"]
