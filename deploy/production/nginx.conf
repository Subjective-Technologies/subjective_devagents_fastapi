# The public HTTP socket forwards to this loopback listener. One FastAPI instance
# serves both the HTML and API, so their deployment and instance stamps agree.
worker_processes 1;
pid /run/subjective-devagents-proxy/nginx.pid;
error_log stderr warn;
events { worker_connections 512; }
http {
    access_log off;
    client_body_temp_path /run/subjective-devagents-proxy/body;
    proxy_temp_path /run/subjective-devagents-proxy/proxy;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 127.0.0.1:8788;
        client_max_body_size 64m;
        location / {
            proxy_pass https://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_ssl_server_name on;
            proxy_ssl_name devagents-api.subjectivetechnologies.com;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify_depth 3;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
