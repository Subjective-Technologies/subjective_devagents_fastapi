# Pipeline for subjective_devagents_fastapi.
# Runs on every push to main, on pull requests, and by hand (Actions -> Pipeline -> Run workflow).
# Status of every project's last run: dashboard -> ST Backend -> Pipelines.
name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: [self-hosted, linux]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Create virtualenv
        run: |
          uv venv --python 3.11 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Install internal packages (public repos)
        run: |
          uv pip install "brainboost-configuration-package @ git+https://github.com/Subjective-Technologies/brainboost_configuration_package.git"
          uv pip install "brainboost-data-source-logger-package @ git+https://github.com/Subjective-Technologies/brainboost_data_source_logger_package.git"
          uv pip install "subjective-abstract-data-source-package @ git+https://github.com/Subjective-Technologies/subjective-abstract-data-source-package.git"
      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]"
          uv pip install pytest
      - name: Test
        run: python -m pytest -q tests
