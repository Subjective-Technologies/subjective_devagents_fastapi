# Pipeline for subjective_devagents_fastapi.
# Runs on every push to main, on pull requests, and by hand (Actions -> Pipeline -> Run workflow).
# Status of every project's last run: dashboard -> ST Backend -> Pipelines.
name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    # GitHub-hosted (the repository is public): the self-hosted runner group never
    # picked this repository up, so every run sat queued until the next push cancelled it.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Create virtualenv
        run: |
          uv venv --python 3.11 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Install internal packages (public repos)
        run: |
          uv pip install "brainboost-configuration-package @ git+https://github.com/Subjective-Technologies/brainboost_configuration_package.git"
          uv pip install "brainboost-data-source-logger-package @ git+https://github.com/Subjective-Technologies/brainboost_data_source_logger_package.git"
          uv pip install "subjective-abstract-data-source-package @ git+https://github.com/Subjective-Technologies/subjective-abstract-data-source-package.git"
      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]"
          uv pip install pytest
      - name: Test
        run: python -m pytest -q tests

  # There is no single deploy target: every company server (ours and each customer VPS)
  # follows the `stable` tag with scripts/update_from_stable.sh, run by a systemd timer
  # that company_setup.sh installs. This job only moves `stable` to a commit whose tests
  # passed, and never backwards.
  release:
    name: Release (move stable)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Move stable to the tested commit (fast-forward only)
        run: |
          git fetch --force origin 'refs/tags/stable:refs/tags/stable' || true
          if git rev-parse -q --verify 'refs/tags/stable^{commit}' >/dev/null; then
            if ! git merge-base --is-ancestor 'refs/tags/stable^{commit}' "$GITHUB_SHA"; then
              echo "stable is not an ancestor of $GITHUB_SHA; not moving it backwards or sideways"
              exit 0
            fi
          fi
          git tag -f stable "$GITHUB_SHA"
          git push -f origin refs/tags/stable
          echo "stable -> $GITHUB_SHA"
